<!doctype html>

<head>
  <meta charset="utf-8">
  <title>Colours</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.zinc.css">
  <link rel="stylesheet" href="css/colours.css">

</head>

<body>

  <ul>
    <li><a href="https://wholesalepaint.com.au/pages/australian-standard-colour-chart-as2700">AS2700 Australian standard Colours</a></li>
    <li><a href="https://wholesalepaint.com.au/pages/british-standard-colour-chart">British Standard Colour Chart | BS 381C & BS 4800</a></li>
  </ul>

  <div class="color-row">
      <div class="block matcha" data-tooltip="Kia 2026">Matcha</div>
      <div class="block opaline" data-tooltip="AS2700">Opaline</div>
      <div class="block glacier" data-tooltip="AS2700">Glacier</div>
  </div>
  <div class="color-row">
      <div class="block sky" data-tooltip="BS381C 210">Sky</div>
      <div class="block light-admiralty-grey" data-tooltip="BS381C 697">Light admiralty grey</div>
      <div class="block glacial-green" data-tooltip="BS4800 14-C-31">Glacial green</div>
  </div>
  <div class="color-row">
      <div class="block duck-egg-blue" data-tooltip="BS4800 16-C-33">Duck egg blue</div>
      <div class="block light-green" data-tooltip="BS4800 14-E-49">Light green</div>
      <div class="block turquoise" data-tooltip="BS4800 16-E-50">Turquoise</div>
  </div>

</body>

</html>
